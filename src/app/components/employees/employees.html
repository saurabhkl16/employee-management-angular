<div class="employees">
  <h4>Employee List</h4>
  <div class="actions d-flex justify-content-between mb-3 mt-2">
    <div class="filter">
      <input type="text" placeholder="search employee" />
    </div>
    <div class="add-employee">
      <button class="btn btn-success" [routerLink]="['/dashboard/create-employee']">Add Employee</button>
    </div>
  </div>
  <div class="employee-list">
    <div class="mat-elevation-z8">
      <table mat-table [dataSource]="dataSource">
        <!-- Sr no Column -->
        <ng-container matColumnDef="position">
          <th mat-header-cell *matHeaderCellDef>No.</th>
          <td mat-cell *matCellDef="let element">{{ element.position }}</td>
        </ng-container>

        <!-- Name & Surname Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let element">{{ element.name + ' ' + element.surname }}</td>
        </ng-container>

        <!-- Department Column -->
        <ng-container matColumnDef="department">
          <th mat-header-cell *matHeaderCellDef>Department</th>
          <td mat-cell *matCellDef="let element">{{ element.department }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" matTooltip="Edit Employee">
              <mat-icon>edit</mat-icon>
            </button>

            <button mat-icon-button color="primary" matTooltip="Copy Employee">
              <mat-icon>content_copy</mat-icon>
            </button>

            <button mat-icon-button color="warn" matTooltip="Delete Employee">
              <mat-icon>delete</mat-icon>
            </button>

            <button mat-icon-button matTooltip="View Employee">
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <mat-paginator
        [pageSizeOptions]="[10, 20, 30]"
        showFirstLastButtons
        aria-label="Select page of periodic elements"
      >
      </mat-paginator>
    </div>
  </div>
</div>
