<div class="login-page">
  <div class="login">
    <h2 class="text-center">Login</h2>
    <form class="mt-3" [formGroup]="loginForm" (ngSubmit)="handleLogin()">
      <div class="username m-0">
        <label for="email">Email</label>
        <input name="email" type="email" placeholder="enter your email" formControlName="email" />
        @if (email?.touched && email?.hasError('required')) {
          <div class="error-message">
            <span>Required Field</span>
          </div>
        } @else {
          <div class="error-message"></div>
        }
      </div>
      <div class="password m-0">
        <label for="password">Password</label>
        <input
          name="password"
          type="password"
          placeholder="enter your password"
          formControlName="password"
        />
        @if (password?.touched && password?.hasError('required')) {
          <div class="error-message">
            <span>Required Field</span>
          </div>
        } @else {
          <div class="error-message"></div>
        }
      </div>
      <div class="d-flex justify-content-around mb-2">
        <a class="text-primary" [routerLink]="['/signup']">Register Employee</a>
        <a class="text-danger" href="#">Forgot Password?</a>
      </div>
      <button class="btn btn-success w-100" type="submit">Login</button>
    </form>
  </div>
</div>
